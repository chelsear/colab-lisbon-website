[build]
  publish = "."
  functions = "netlify/functions"

# Claude Code workshop page is hidden for now; the page file stays in claude-code/ for later.
# Remove these two rules to bring it back.
[[redirects]]
  from = "/claude-code"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/claude-code/*"
  to = "/"
  status = 302
  force = true

# Master Claude course is password-protected until launch (netlify/edge-functions/master-claude-gate.js).
# Password: MASTER_CLAUDE_PASSWORD env var in Netlify (shared with the Next Level guide below).
# Remove these two blocks to make it public.
[[edge_functions]]
  path = "/master-claude"
  function = "master-claude-gate"

[[edge_functions]]
  path = "/master-claude/*"
  function = "master-claude-gate"

# Next Level AI student guide, behind the same gate and password.
[[edge_functions]]
  path = "/next level ai guide"
  function = "master-claude-gate"

[[edge_functions]]
  path = "/next level ai guide/*"
  function = "master-claude-gate"

[[edge_functions]]
  path = "/next%20level%20ai%20guide/*"
  function = "master-claude-gate"
